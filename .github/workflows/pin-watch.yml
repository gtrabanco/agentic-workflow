name: Pin watch

# The early warning in front of the PR-time pin gate (feature 67 P3, AC2, issue
# #219 decision D1's addendum; obligation O3).
#
# Every pin in this repository — runtime AND development, in every package under
# `packages/` — is supposed to match what the registry offers, and a pin that has
# fallen behind is invisible until someone opens a PR: `version-parity-gate.mjs
# --pins` only runs there, and it verifies exact pins only. So this job asks the
# registry once a week and, when one has drifted, takes the action selected at
# dispatch time (issues or pr). On schedule, always files tracking issues so
# the operator sees drift even when they don't manually run it.
#
# Three spec kinds, three answers:
#   exact (`6.0.3`)   the registry's latest is above the pin  ⇒ drift.
#   partial (`7`)     the registry's newest release INSIDE the range is above
#                     the version the committed lock resolves ⇒ drift. A newer
#                     major outside the range is a NOTICE, never drift: taking a
#                     major is an owner decision (AGENTS.md → Packages).
#   floating (`^7`)   reported as skipped with its reason — a range cannot be
#                     watched, and it must not pass in silence either.
# Nightlies never count as news: the report compares against released versions.
#
# The issue / PR points at the dependency's release notes and asks the reader
# to record which changes matter before bumping — the watch names the version
# that moved, not what it changed.
#
# It bumps nothing by default (schedule runs issues only). When dispatched
# with `mode: pr` it bumps all drifted exact pins, commits, pushes and opens
# a single PR — the operator reviews and merges; `unit-lane` can be applied
# to the PR for code adaptation if needed.
#
# Exit semantics of `scripts/pin-watch.mjs` (both modes):
#   0 — no drift, or all drifted dependencies already have their tracking issue
#       (a weekly job that re-files a known drift must stay green, or the alert
#       becomes the noise it was meant to avoid)
#   0 — the registry was unreachable: degraded, never failed (a network blip
#       must not redden a scheduled run no commit caused — the same rule
#       `--pins` follows)
#   1 — new tracking issue opened (issues mode), or new PR opened (pr mode)
#
# Run it by hand any time:
#   gh workflow run pin-watch.yml          # issues (default)
#   gh workflow run pin-watch.yml -f mode=pr  # open a bump PR

on:
  schedule:
    # Mondays 06:17 UTC. Off the top of the hour on purpose: GitHub's scheduler
    # queues the :00 stampede first, and a delayed run reads as a broken one.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Action to take on drift"
        required: true
        default: "issues"
        type: choice
        options:
          - issues     # open tracking issues only
          - pr         # open a PR that bumps all drifted exact pins

permissions:
  contents: write # the pr mode pushes the bump commit and its lockfile refresh
  issues: write # tracking issues (issues mode)
  pull-requests: write # the pr-mode PR — Actions permissions are static per workflow file, so a dispatch-only grant rides every run

concurrency:
  group: pin-watch
  cancel-in-progress: false

jobs:
  pin-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      # The watch reads each package's manifest directly and spawns `npm view`
      # for the registry and `gh` for the issues / PR — no install step,
      # because it imports nothing outside node builtins.
      - name: Watch every dependency pin (runtime and development)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE=${{ inputs.mode || 'issues' }}
          if [ "$MODE" = "pr" ]; then
            # actions/checkout configures no commit identity; the bump commit
            # needs one, and the repo must allow Actions to create PRs.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            node scripts/pin-watch.mjs --file-pr
          else
            node scripts/pin-watch.mjs --file-issues
          fi
