name: Publish runner crate

# Publishes @gtrabanco/agentic-workflow to npm whenever a push to main touches
# the crate AND that exact version is not on the registry yet (already-published
# versions are a safe no-op — the gate asks exact-version membership, never
# "is it the latest": see scripts/npm-version-gate.mjs).
# Also runnable by hand
# (workflow_dispatch) — e.g. to retry a failed run.
#
# The crate has one pinned dependency (typebox) and a lockfile: the test gate
# installs the crate first, then runs the same suite through bun (bun-first
# convention) and through plain node (the #197 fallback guarantee). npm still does the actual
# `publish` step, since Trusted Publishing + --provenance are npm-CLI-specific
# tooling Bun doesn't replicate.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN secret at all. npm
# exchanges this job's GitHub OIDC token (the id-token: write permission
# below) for a short-lived publish token at publish time, scoped to exactly
# this repo + workflow file.
#
# One-time setup (manual, by the repo owner — CI cannot do this for you):
#   1. The FIRST publish is manual (npm requires it for a brand-new package):
#      cd packages/agentic-workflow && npm publish --access public
#   2. npmjs.com → the package's page → Settings → Trusted Publisher →
#      GitHub Actions → Organization or user: gtrabanco → Repository:
#      agentic-workflow → Workflow filename: publish-agentic-workflow.yml →
#      (leave Environment name blank unless this job later runs under one) → Add.
#   From then on, CI publishes every version bump on merge.
#
# Troubleshooting — "npm error 403 … OIDC permission denied for this action":
#   Verify on npmjs.com → the package's page → Settings → Trusted Publisher:
#     - Provider: GitHub Actions
#     - Organization or user: gtrabanco
#     - Repository: agentic-workflow
#     - Workflow filename: publish-agentic-workflow.yml
#     - Environment name: blank
#   Diagnose: gh run view --log-failed <run-id>
#   Re-run once the config is fixed: gh workflow run publish-agentic-workflow.yml

on:
  # Dependency order (feature 40, issue #180): this package's install pins
  # "Publish schema package" exactly, so it must already be on the registry when the
  # gate installs — this workflow only runs after that upstream published.
  # workflow_run checks out the default branch (the release train's head).
  workflow_run:
    workflows: ["Publish schema package"]
    types: [completed]
  workflow_dispatch:
    # Release channel for this run (feature 40, issue #180): `latest` (the
    # default — push-triggered runs behave exactly as before), or a prerelease
    # dist-tag (`canary` / `alpha` / `beta` / `rc`) for a manual promotion.
    # Only `latest` moves the latest dist-tag; every other channel publishes
    # under its own tag and never touches latest.
    inputs:
      channel:
        description: "npm dist-tag for this publish (latest | canary | alpha | beta | rc)"
        type: string
        required: false
        default: latest

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing + --provenance

jobs:
  node-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agentic-workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install deps (node-compat — typebox is a pinned dependency)
        run: bun install --frozen-lockfile
      - name: Test (node runtime — the guaranteed fallback)
        run: node --test

  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agentic-workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Keep in lockstep with publish-schema.yml and publish-pi-package.yml
          # and with the bun that generates the committed bun.lock files.
          bun-version: 1.4.0

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@latest

      # The gate needs the crate's pinned dependencies: `src/doc/envelope.mjs`
      # imports `typebox` lazily, so without node_modules every test that reaches
      # `--json-only` fails module resolution. Same install the node-compat job
      # runs, same frozen lockfile — the gate must never be red for a reason the
      # runner never installed.
      - name: Install deps (the gate needs typebox)
        run: bun install --frozen-lockfile

      - name: Test (the gate — never publish red)
        run: bun test test/

      # Exact-version membership, never dist-tag equality — a version already
      # on the registry must skip instead of failing the run with EBADVERSION
      # (the gate that failed on 2026-09-27 in publish-pi-package.yml).
      - name: Skip when the version is already published
        id: version
        run: node "$GITHUB_WORKSPACE/scripts/npm-version-gate.mjs" >> "$GITHUB_OUTPUT"

      - name: Surface the gate's notice
        if: steps.version.outputs.notice != ''
        env:
          NOTICE: ${{ steps.version.outputs.notice }}
        run: echo "::warning::$NOTICE"

      - name: Publish to npm (Trusted Publishing — no token)
        id: publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance --tag "${{ inputs.channel || 'latest' }}"

      - name: Troubleshooting pointer on failure
        if: failure() && steps.publish.outcome == 'failure'
        run: echo "publish failed — if E403 OIDC, verify the npm Trusted Publisher config; see this file's header"
