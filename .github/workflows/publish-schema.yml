name: Publish schema package

# Publishes @gtrabanco/agentic-workflow-schema to npm whenever a push to main
# touches the package AND its package.json version is newer than the one on
# the registry (same-version pushes are a safe no-op).
#
# Bun installs deps and runs the test gate (bun.lock is the source of truth —
# there is no package-lock.json); npm still does the actual `publish` step,
# since npm's --provenance attestation is npm-CLI-specific tooling Bun
# doesn't replicate.
#
# One-time setup (manual, by the repo owner — CI cannot do this for you):
#   1. First publish is manual (npm requires it for a brand-new package) —
#      already done for 1.0.0. Any later version still publishes via this
#      workflow automatically once the token below is configured.
#   2. Create an npm token for CI: npmjs.com → avatar → Access Tokens →
#      Generate New Token → **Granular Access Token** → Packages & scopes:
#      Read and write, only @gtrabanco/agentic-workflow-schema.
#   3. Save it in this repo: GitHub → Settings → Secrets and variables →
#      Actions → New repository secret → name: NPM_TOKEN.
#   4. (Recommended) npm package settings → require 2FA "Automation" so the
#      token can publish without an OTP prompt.

on:
  push:
    branches: [main]
    paths:
      - "packages/agentic-workflow-schema/**"
      - ".github/workflows/publish-schema.yml"

permissions:
  contents: read
  id-token: write # npm --provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agentic-workflow-schema
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install (bun, frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build + test (the gate — never publish red)
        run: bun run test

      - name: Skip when the version is already published
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null || echo "none")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
