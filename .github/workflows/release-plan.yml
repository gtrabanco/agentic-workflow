name: Release plan

# Read-only release suggestion (feature 40, issue #180). Launches by hand and
# prints — in the run log AND the run summary — the version the pipeline would
# cut today, for both channels:
#
#   stable — the unified train version: last stable v-tag + the highest bump
#            across the accumulated .changeset/*.md intent files (every PR
#            annotates its semver type in the frontmatter; the body is the
#            release note that builds the changelog).
#   canary — <base>-canary.<yyyymmdd>.<n>: floats above the last stable until
#            the next stable cuts (a release outranks any prerelease).
#
# This workflow PUBLISHES NOTHING: nothing reaches npm, nothing is
# applied, no tag, no release. Publishing stays in publish-schema.yml / publish-pi-package.yml /
# publish-agentic-workflow.yml (the npm Trusted Publisher records are bound to
# those filenames); cutting the train stays with the operator
# (apply mode + pushing the release commit).
#
# Inputs:
#   version — preview a forced version instead of the computed one (D-40-4):
#             the plan runs with --version and marks the body
#             "Version forced by operator".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Preview this exact version instead of the computed train (X.Y.Z, optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the base is the last stable v-tag)
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      # Env-carried input: the forced version never lands in a shell command
      # line unevaluated.
      - name: Stable suggestion (train version from the accumulated changesets)
        env:
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          ARGS=""
          if [ -n "$FORCE_VERSION" ]; then ARGS="--version $FORCE_VERSION"; fi
          node scripts/release.mjs plan $ARGS | tee plan-stable.txt

      - name: Canary suggestion (floats above the last stable)
        run: node scripts/release.mjs plan --channel canary | tee plan-canary.txt

      - name: Run summary
        if: always()
        run: |
          {
            echo "## Release plan"
            echo ""
            echo "Cut order when you decide: run the apply mode of scripts/release.mjs, commit the train and push"
            echo "(the publish workflows publish \`latest\`), then the tag + \`stable\` branch +"
            echo "release-creation commands the stable plan prints. Canary cuts are grouped"
            echo "by you — changesets accumulate until you launch this or cut."
            echo ""
            echo "### Stable (latest) suggestion"
            echo ""
            echo '```'
            cat plan-stable.txt 2>/dev/null || echo "(plan failed — see the log; usually no changesets and no forced version)"
            echo '```'
            echo ""
            echo "### Canary suggestion"
            echo ""
            echo '```'
            cat plan-canary.txt 2>/dev/null || echo "(plan failed — see the log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
