name: Release train

# The apply GHA (feature 40, issue #180): one launch = one release train.
# The operator decides WHEN (grouping small changes is deliberate — canary and
# stable cut on demand, never per merge). This workflow:
#
#   1. applies the train — every package.json version moves to the computed
#      train version, every exact local pin moves with it (D-40-10), the
#      CHANGELOG companion rows are written from the changeset bodies;
#   2. refreshes the lockfiles (the pins moved — frozen lockfiles would fail
#      CI otherwise, by design);
#   3. adds exactly ONE release commit and pushes it — the push fires the
#      publish chain (schema → runner crate → pi), which publishes npm;
#   4. tags vX.Y.Z, fast-forwards the stable branch and opens the GitHub
#      Release with the changeset bodies as notes (--generate-notes credits
#      the merged PR authors).
#
# This workflow never touches npm — publishing stays exclusively in
# publish-schema.yml / publish-agentic-workflow.yml / publish-pi-package.yml
# (the npm Trusted Publisher records bind those filenames; the commit push
# fires that chain).
#
# Inputs:
#   version — force this exact version instead of the computed train (D-40-4);
#             the release notes are marked "Version forced by operator".
#
# To SEE what would be cut without applying anything, launch release-plan.yml
# instead (read-only suggestion for stable and canary).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Force this exact version instead of the computed train (X.Y.Z, optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: write # the release commit, the tag, the stable branch, the release

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the base is the last stable v-tag)
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - name: Setup Bun (lockfiles are bun.lock — kept in lockstep with CI)
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Apply the train (versions + pins + changelog rows)
        env:
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          ARGS=""
          if [ -n "$FORCE_VERSION" ]; then ARGS="--version $FORCE_VERSION"; fi
          node scripts/release.mjs apply $ARGS

      - name: Refresh lockfiles (the pins moved with the train)
        run: |
          for d in packages/*/; do
            if [ -f "$d/bun.lock" ]; then
              echo "::group::bun install $d"
              (cd "$d" && bun install)
              echo "::endgroup::"
            fi
          done

      - name: Commit the release
        env:
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          if git diff --quiet; then
            echo "::error::nothing to commit — the train at HEAD already carries this release (already applied? no changesets?)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): cut the version train"
          echo "VERSION=$(node -p "require('./packages/agentic-workflow-schema/package.json').version")" >> "$GITHUB_ENV"

      - name: Push the release commit (fires the publish chain)
        run: git push

      - name: Tag, fast-forward stable, open the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs release-notes > release-notes.txt
          git tag "v$VERSION"
          git push origin "v$VERSION"
          git push origin "HEAD:refs/heads/stable"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION" --notes-file release-notes.txt
