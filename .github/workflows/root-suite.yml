name: Root suite

# MANUAL ONLY (owner decision 2026-11-04). The rule — and why the gate is
# local-first — lives in `AGENTS.md` → Verification → "Where the gate runs";
# this file carries the wiring, never a second copy of the rule.
#
# Run it on a branch before merging:
#
#   gh workflow run root-suite.yml --ref <branch>
#
# The job runs `scripts/local-gate.mjs` — the same ordered list, fail-fast, that
# a contributor runs with `bun scripts/local-gate.mjs`. There is deliberately no
# step list here: a check that lived only in this file would drift from the
# local gate, and a check that lived only in the local gate would be invisible
# to a contributor whose checkout cannot run it. `scripts/release-workflows.test.mjs`
# pins that this workflow delegates instead of transcribing.
#
# A fork's pull request cannot be dispatched by branch name (its branch is not a
# ref in this repository): check it out and run the gate locally.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: root-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Full history, not the default shallow clone: the ledger-provenance
          # suite resolves which commit ticked a fold row by walking git log, and
          # the content half of the version-parity gate diffs against main. A
          # one-commit clone turns both into false results.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Keep in lockstep with the publish workflows: 1.4.0 writes lockfile
          # version 2, which an older bun cannot parse.
          bun-version: 1.4.0

      - name: Gate (every check, fail-fast)
        run: node scripts/local-gate.mjs
