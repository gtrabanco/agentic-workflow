name: Root suite

# The repository's own suites — `scripts/*.test.mjs`: the normative-drift gate,
# the pre-execution contract/sensor/timeline suites, the golden fixture, phase
# lint, the skill-context budgets, the receipt and hand-off contracts — ran only
# by hand until this workflow existed. Nothing enforced them.
#
# That gap is not theoretical. A package version bump shipped without its
# `CHANGELOG.md` row, which is exactly what `normative-drift.test.mjs` exists to
# refuse, and it reached `main`: the publish workflows run the *package* suites,
# which cannot see a repository-wide drift gate. This job runs on every change
# to any path, because the suites read the whole tree.
#
# No `bun install` at the repository root: there is no root package. The one
# prerequisite is the schema package's build output, which
# `scripts/schema-runtime.mjs` resolves as `packages/agentic-workflow-schema/dist`
# and which is gitignored — the pre-execution fixtures symlink `packages/` into a
# temp repo and require it, so without the build those suites fail on a missing
# module rather than on a defect.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: root-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Full history, not the default shallow clone: the ledger-provenance
          # suite resolves which commit ticked a fold row by walking git log, so
          # a one-commit clone attributes every row to HEAD and reports all of
          # them unproven — a false red that says nothing about the change.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Keep in lockstep with the publish workflows: 1.4.0 writes lockfile
          # version 2, which an older bun cannot parse.
          bun-version: 1.4.0

      - name: Build the schema package (the suites resolve its dist/)
        run: bun install --frozen-lockfile && bun run build
        working-directory: packages/agentic-workflow-schema

      - name: Install the crate
        run: bun install --frozen-lockfile
        working-directory: packages/agentic-workflow

      - name: Crate suite (bun runtime)
        run: bun run test
        working-directory: packages/agentic-workflow

      - name: Crate suite (node runtime)
        run: bun run test:node
        working-directory: packages/agentic-workflow

      - name: Root suites
        run: node --test scripts/*.test.mjs

  # Compatibility guard for @gtrabanco/pi-agentic-workflow (issue #283): the
  # package's own tsc only runs in publish-pi-package.yml — post-merge, and
  # against the pi version the frozen bun.lock pins — so a pi API change could
  # reach main unseen. This job type-checks src/ against TWO pi legs, both
  # installed OUTSIDE the lockfile path (temp copy + `npm install --no-save
  # --no-package-lock`; an npm lockfile under packages/ is refused by
  # test/lockfile-policy.test.mjs): (a) the peer floor 0.99.1 — keep this pin
  # in lockstep with the peerDependencies floor in
  # packages/pi-agentic-workflow/package.json; (b) `latest` — the npm dist-tag
  # by design, so a breaking pi release trips this PR red here first.
  pi-compat-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - name: Type-check src against the peer floor and latest pi (temp copy, no lockfile)
        run: |
          set -euo pipefail
          for leg in 0.99.1 latest; do
            tmp="$(mktemp -d)"
            cp -r packages/pi-agentic-workflow/src "$tmp/src"
            cp packages/pi-agentic-workflow/tsconfig.json packages/pi-agentic-workflow/package.json "$tmp/"
            echo "::group::pi leg $leg"
            (
              cd "$tmp"
              npm install --ignore-scripts --no-save --no-package-lock \
                "@earendil-works/pi-coding-agent@$leg" \
                "@earendil-works/pi-tui@$leg" >/dev/null
              ./node_modules/.bin/tsc --noEmit
            )
            echo "::endgroup::"
            rm -rf "$tmp"
            echo "pi leg $leg: tsc --noEmit clean"
          done
