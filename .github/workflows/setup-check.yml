name: Setup check

# The authoring toolchain's own CI leg (issue #331, AC5): a pristine runner is
# provisioned with `node scripts/setup-env.mjs`, then verified with the
# read-only `--check` — the exact two commands a fresh clone runs (S4). The
# provision step comes first because `--check` on a bare machine fails by
# design (nothing is installed yet); the job deliberately fails visibly when an
# upstream installer (bun.sh, astral.sh, PyPI, Homebrew tap, GitHub Releases)
# breaks — degraded mode is never silent here, unlike the registry-half gates
# that merely report.
#
# The `pi` CLI is installed ahead of provisioning because `setup-env.mjs`
# treats a missing pi as an unresolvable prerequisite for the `gentle-engram`
# step and exits non-zero — installing pi is a human prerequisite, not a script
# step (docs/workflow/SETUP.md → Prerequisites).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: setup-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - name: Install the pi CLI (a human prerequisite the script refuses to install)
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Provision the toolchain
        run: node scripts/setup-env.mjs

      # The busy installers only mutate the shell profile, so the binaries land in
      # `~/.bun/bin` and `~/.local/bin` — dirs a fresh runner step does not have on
      # PATH. `setup-env.mjs` prepends them for its own process (that is how its
      # verify→fix loop finds what pass 1 installed); a later step starts from the
      # runner's default PATH, so the two dirs are published here or the --check
      # below reports `MISS bun` on a machine that just installed it.
      - name: Publish the installer bin directories to later steps
        run: |
          mkdir -p "$HOME/.bun/bin" "$HOME/.local/bin"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify with the read-only check (S4)
        run: node scripts/setup-env.mjs --check
