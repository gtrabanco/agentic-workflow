# Claude-branch model routing
#
# Source of truth for the `claude` branch's per-skill model:/effort: frontmatter.
# The default branch (`main`, aliased as `inheritance`) carries none of this —
# skills there inherit the host agent's configured model/effort. This file is
# read by .github/workflows/sync-derived-branches.yml to inject the two lines
# back into each skill's frontmatter when regenerating the `claude` branch.
# Edit this file (never the `claude` branch directly) to change a tier;
# bump-skill keeps it, the README table, and CHANGELOG in sync.

